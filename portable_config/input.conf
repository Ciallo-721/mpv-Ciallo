### ====================== 不映射菜单 ======================

 POWER             quit                                                  # 退出
 PLAY              set pause no                                          # 暂停
 PAUSE             set pause yes                                         # 播放
 PLAYPAUSE         cycle pause                                           # 暂停/播放
 STOP              stop                                                  # 停止
 PREV              script-binding uosc/prev                              # uosc跳转上一个文件
 NEXT              script-binding uosc/next                              # uosc跳转下一个文件

 MBTN_LEFT         ignore                                                # 左键单击 - 无
 MBTN_LEFT_DBL     cycle fullscreen                                      # 左键双击 - 全屏/窗口
 MBTN_RIGHT        script-binding uosc/menu                              # 右键单击 - 打开uosc菜单
 MBTN_RIGHT_DBL    ignore                                                # 右键双击 - 无

 ESC               set fullscreen no                                     # 窗口
 ENTER             cycle fullscreen                                      # 全屏
 SPACE             cycle pause                                           # 暂停
 UP                script-binding uosc/prev                              # 上一个视频
 DOWN              script-binding uosc/next                              # 下一个视频
 LEFT              seek -5 exact ; script-message-to uosc flash-elements timeline    # 回退 5 秒
#RIGHT             seek  5 exact ; script-message-to uosc flash-elements timeline    # 快进 5 秒

 Alt+MBTN_LEFT     script-binding positioning/drag-to-pan                # 移动画面
 Alt+MBTN_RIGHT    no-osd set video-zoom 0 ; no-osd set panscan 0 ; no-osd set video-pan-x 0 ; no-osd set video-pan-y 0 ; no-osd set video-align-x 0 ; no-osd set video-align-y 0 ; show-text "重置 --video-zoom --panscan --video-pan --video-align"
 Alt+WHEEL_DOWN    script-binding positioning/cursor-centric-zoom -0.1   # 缩小画面
 Alt+WHEEL_UP      script-binding positioning/cursor-centric-zoom  0.1   # 放大画面
