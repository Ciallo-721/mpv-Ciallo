[                  cycle-values video-rotate 0 270 180 90                #! 画面 > 左旋转
]                  cycle-values video-rotate 0 90 180 270                #! 画面 > 右旋转
\                  set video-zoom 0; set panscan 0; set video-rotate 0   #! 画面 > 重置

