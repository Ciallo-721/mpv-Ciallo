 ,                 frame-back-step                                       #! 播放 > 上一帧
 .                 frame-step                                            #! 播放 > 下一帧
 /                 ab-loop                                               #! 播放 > 设置/清除 AB循环点
 -                 no-osd add speed -0.1 ; script-message-to uosc flash-elements speed   #! 播放 > 速度 -
 =                 no-osd add speed  0.1 ; script-message-to uosc flash-elements speed   #! 播放 > 速度 +
 BS                no-osd cycle-values speed 1 ; script-message-to uosc flash-elements speed   #! 播放 > 速度恢复
 ;                 no-osd add volume -1 ; script-message-to uosc flash-elements volume   #! 播放 > 音量 -
 '                 no-osd add volume  1 ; script-message-to uosc flash-elements volume   #! 播放 > 音量 +
 Alt+q             cycle audio ; show-text "音轨 ${aid}"                 #! 播放 > 切换音轨
#                  ignore                                                #! 播放 > ---
#                  ignore                                                #! 播放 > ---
 z                 add sub-delay -0.1                                    #! 播放 > 字幕预载 100ms
 x                 add sub-delay  0.1                                    #! 播放 > 字幕延迟 100ms
 c                 add audio-delay -0.1                                  #! 播放 > 音频预载 100ms
 v                 add audio-delay  0.1                                  #! 播放 > 音频延迟 100ms
#                  ignore                                                #! 播放 > ---
 b                 set audio-delay 0 ; set sub-delay 0                   #! 播放 > 重置 音频与字幕同步

